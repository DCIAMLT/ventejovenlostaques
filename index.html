<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vente Joven Los Taques</title>
    <link rel="icon" type="image/png" href="img/ventejlostaquesicon.png">
    <link rel="stylesheet" href="css/estilos.css">
    <!-- API de Google reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="body-login">
    
    <div class="login-container">
        <img src="img/ventejlostaques.png" alt="Logo Vente Joven">
        <h2>Control Interno Municipal</h2>
        
        <div class="form-group">
            <label for="emailInput">Correo Electrónico</label>
            <input type="email" id="emailInput" class="form-control" placeholder="usuario@ventejoven.com" required>
        </div>

        <div class="form-group">
            <label for="passwordInput">Contraseña</label>
            <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" onkeypress="if(event.key === 'Enter') login()" required>
        </div>
        
        <!-- Casilla de verificación Google reCAPTCHA v2 -->
        <div class="form-group" style="display: flex; justify-content: center; margin: 1rem 0;">
            <div class="g-recaptcha" data-sitekey="6LewvJMtAAAAAONeUfDjgtZE023EevpVg1KywZu6"></div>
        </div>

        <button class="btn-login" onclick="login()">Ingresar al Sistema</button>
    </div>

    <!-- SDKs de Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
